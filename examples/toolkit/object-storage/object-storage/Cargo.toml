[package]
name = "object-storage"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Example gear: a small object store whose CRUD operations are under Operation Governance"

[lib]
name = "object_storage"

[lints]
workspace = true

[dependencies]
object-storage-sdk = { path = "../object-storage-sdk" }

# Operation Governance: Governance Enforcer and Fact provider contract.
operation-governance-sdk = { workspace = true }

# AuthZ resolver for authorization (PEP flow); runs before governance.
authz-resolver-sdk = { package = "cf-gears-authz-resolver-sdk", path = "../../../../gears/system/authz-resolver/authz-resolver-sdk" }
authz-resolver = { workspace = true }
types-registry = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, features = ["time"] }
axum = { workspace = true, features = ["macros"] }
uuid = { workspace = true }
time = { workspace = true }
thiserror = { workspace = true }

# Database - SeaORM (driver features come from toolkit-db)
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }

toolkit = { workspace = true }
toolkit-db = { workspace = true, features = ["sqlite", "pg"] }
toolkit-db-macros = { workspace = true }
toolkit-canonical-errors = { workspace = true, features = ["axum"] }
toolkit-security = { workspace = true }
toolkit-macros = { workspace = true }

[dev-dependencies]
toolkit-db = { workspace = true, features = ["sqlite", "test-support"] }
operation-governance-sdk = { workspace = true, features = ["test-support"] }
og-rego-config-plugin = { package = "cf-gears-og-rego-config-plugin", path = "../../../../gears/system/operation-governance/plugins/rego-config-plugin" }
